<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="calculator">
      <div class="header">
        Discount Calculator
      </div>
      <div class="form">
        <label for="bill" class="input-group">
          <p>Bill Amount</p>
          <input type="number" id="bill">
        </label>
        <label for="percentage" class="input-group">
          <p>Discount Percentage</p>
          <input type="number" id="percentage">
        </label>

        <button class="calculate" onclick="calculateDiscount()">Calculate Discount</button>
      </div>

      <div class="result-box">
        <div class="result-discount" id="result-discount">
          <p>Your Discount will appear here</p>
        </div>
        <div class="result-total" id="result-total">
          <p>Your Total will appear here</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
